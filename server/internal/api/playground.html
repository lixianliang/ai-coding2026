<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海龟汤语音链路测试</title>
<style>
  :root { color-scheme: light; --ink:#17202a; --muted:#64748b; --line:#dbe3ec; --accent:#0f766e; --bg:#f4f7f9; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif; color:var(--ink); background:var(--bg); }
  main { width:min(760px,calc(100% - 32px)); margin:40px auto; }
  h1 { margin:0 0 8px; font-size:28px; }
  .muted { color:var(--muted); }
  .card { margin-top:20px; padding:24px; border:1px solid var(--line); border-radius:14px; background:white; box-shadow:0 10px 30px #17202a0b; }
  .surface { font-size:20px; font-weight:650; }
  label { display:block; margin:14px 0 6px; color:var(--muted); font-size:14px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px; font:inherit; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
  button { padding:11px 18px; border:0; border-radius:9px; background:var(--accent); color:white; font:inherit; font-weight:650; cursor:pointer; }
  button.secondary { background:#334155; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #status { min-height:26px; margin-top:14px; color:var(--muted); }
  .result { display:none; margin-top:18px; padding-top:18px; border-top:1px solid var(--line); }
  .grid { display:grid; grid-template-columns:110px 1fr; gap:10px 16px; }
  .key { color:var(--muted); }
  audio { width:100%; margin-top:16px; }
  code { padding:2px 5px; border-radius:5px; background:#eef2f6; }
</style>
</head>
<body>
<main>
  <h1>海龟汤语音链路测试</h1>
  <div class="muted">麦克风 → Qwen ASR → DeepSeek 判题 → MiniMax TTS。录音上传为 16 kHz、单声道、s16le PCM。</div>

  <section class="card">
    <div class="muted">固定汤面</div>
    <div class="surface" id="surface">一个人走进餐厅，点了一碗海龟汤，喝了一口就哭了。为什么？</div>

    <label for="token">Device Token（服务端未配置时留空）</label>
    <input id="token" type="password" autocomplete="off" placeholder="Bearer token 内容">

    <div class="actions">
      <button id="record">开始录音</button>
      <button id="stop" class="secondary" disabled>结束并提交</button>
    </div>
    <div id="status">准备就绪。浏览器麦克风需要 localhost 或 HTTPS。</div>

    <div class="result" id="result">
      <div class="grid">
        <div class="key">识别文本</div><div id="transcript"></div>
        <div class="key">判定</div><div><code id="verdict"></code></div>
        <div class="key">AI 回复</div><div id="speech"></div>
      </div>
      <audio id="player" controls></audio>
    </div>
  </section>
</main>
<script>
const recordButton = document.querySelector('#record');
const stopButton = document.querySelector('#stop');
const statusNode = document.querySelector('#status');
const resultNode = document.querySelector('#result');
const tokenInput = document.querySelector('#token');
const player = document.querySelector('#player');

let audioContext;
let stream;
let processor;
let source;
let chunks = [];
let recording = false;

function setStatus(text) { statusNode.textContent = text; }
function setBusy(busy) {
  recordButton.disabled = busy || recording;
  stopButton.disabled = busy || !recording;
}

async function startRecording() {
  try {
    setStatus('请求麦克风权限…');
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    audioContext = new AudioContext();
    await audioContext.resume();
    source = audioContext.createMediaStreamSource(stream);
    processor = audioContext.createScriptProcessor(4096, 1, 1);
    const mute = audioContext.createGain();
    mute.gain.value = 0;
    chunks = [];
    processor.onaudioprocess = event => {
      chunks.push(new Float32Array(event.inputBuffer.getChannelData(0)));
    };
    source.connect(processor);
    processor.connect(mute);
    mute.connect(audioContext.destination);
    recording = true;
    setBusy(false);
    setStatus(`正在录音（${audioContext.sampleRate} Hz）…`);
  } catch (error) {
    setStatus(`无法录音：${error.message}`);
    cleanupRecording();
  }
}

function cleanupRecording() {
  recording = false;
  if (processor) processor.disconnect();
  if (source) source.disconnect();
  if (stream) stream.getTracks().forEach(track => track.stop());
  if (audioContext) audioContext.close().catch(() => {});
  processor = source = stream = audioContext = undefined;
  setBusy(false);
}

async function stopAndSubmit() {
  if (!recording) return;
  const inputRate = audioContext.sampleRate;
  const input = mergeFloat32(chunks);
  cleanupRecording();
  const pcm = encodePCM16(resample(input, inputRate, 16000));
  if (pcm.byteLength < 3200) {
    setStatus('录音太短，请至少说 0.2 秒。');
    return;
  }
  setBusy(true);
  setStatus(`上传 ${formatBytes(pcm.byteLength)}，等待识别、判题和合成…`);
  const headers = { 'Content-Type': 'application/octet-stream' };
  const token = tokenInput.value.trim();
  if (token) headers.Authorization = `Bearer ${token}`;
  try {
    const response = await fetch('/v1/playground/turn', { method: 'POST', headers, body: pcm });
    const payload = await response.json();
    if (payload.code !== 0) throw new Error(payload.message || `请求失败：${payload.code}`);
    document.querySelector('#transcript').textContent = payload.data.transcript;
    document.querySelector('#verdict').textContent = payload.data.verdict;
    document.querySelector('#speech').textContent = payload.data.speech;
    const wav = pcmToWav(base64ToBytes(payload.data.audio_pcm_base64), payload.data.sample_rate, payload.data.channels, payload.data.bits_per_sample);
    player.src = URL.createObjectURL(new Blob([wav], { type: 'audio/wav' }));
    resultNode.style.display = 'block';
    setStatus('完成。可以播放 AI 回复，或继续录音测试下一句。');
  } catch (error) {
    setStatus(`测试失败：${error.message}`);
  } finally {
    setBusy(false);
  }
}

function mergeFloat32(parts) {
  const length = parts.reduce((sum, part) => sum + part.length, 0);
  const merged = new Float32Array(length);
  let offset = 0;
  for (const part of parts) { merged.set(part, offset); offset += part.length; }
  return merged;
}

function resample(input, inputRate, outputRate) {
  if (inputRate === outputRate) return input;
  const length = Math.floor(input.length * outputRate / inputRate);
  const output = new Float32Array(length);
  const ratio = inputRate / outputRate;
  for (let i = 0; i < length; i++) {
    const position = i * ratio;
    const left = Math.floor(position);
    const right = Math.min(left + 1, input.length - 1);
    const fraction = position - left;
    output[i] = input[left] * (1 - fraction) + input[right] * fraction;
  }
  return output;
}

function encodePCM16(samples) {
  const buffer = new ArrayBuffer(samples.length * 2);
  const view = new DataView(buffer);
  for (let i = 0; i < samples.length; i++) {
    const value = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(i * 2, value < 0 ? value * 0x8000 : value * 0x7fff, true);
  }
  return new Uint8Array(buffer);
}

function pcmToWav(pcm, sampleRate, channels, bitsPerSample) {
  const buffer = new ArrayBuffer(44 + pcm.length);
  const view = new DataView(buffer);
  const writeText = (offset, text) => [...text].forEach((char, index) => view.setUint8(offset + index, char.charCodeAt(0)));
  writeText(0, 'RIFF'); view.setUint32(4, 36 + pcm.length, true); writeText(8, 'WAVE');
  writeText(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, channels, true); view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * channels * bitsPerSample / 8, true);
  view.setUint16(32, channels * bitsPerSample / 8, true); view.setUint16(34, bitsPerSample, true);
  writeText(36, 'data'); view.setUint32(40, pcm.length, true);
  new Uint8Array(buffer, 44).set(pcm);
  return new Uint8Array(buffer);
}

function base64ToBytes(value) {
  const binary = atob(value);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function formatBytes(value) {
  return value >= 1024 * 1024 ? `${(value / 1024 / 1024).toFixed(1)} MB` : `${Math.round(value / 1024)} KB`;
}

recordButton.addEventListener('click', startRecording);
stopButton.addEventListener('click', stopAndSubmit);
</script>
</body>
</html>
